<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Démo Takit'os</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first storefront (wordmark hero, sticky category chips, menu rows, bottom basket bar);
   from 900px a sticky basket column. Staff views (kitchen board, driver list, insights) share the same tokens. */
:root{
  --masa:#FBF1DF; --masa-deep:#F2E0BE; --paper:#FFF9EF; --cafe:#2B1A12; --cafe-soft:#6E5444; --line:#E6D3B1;
  --chile:#C9361E; --chile-ink:#FFF4E6; --chile-soft:#F8D9CC;
  --nopal:#1D6B57; --nopal-ink:#F3FBF7; --nopal-soft:#D6EBE2;
  --sol:#F2B130; --sol-soft:#FBE6B5; --on-sol:#2B1A12;
  --chrome:#2B1A12; --chrome-ink:#FBF1DF; --chrome-soft:#4A3529;
  --ok:#2E7D4F; --ok-ink:#FFFFFF; --warn:#8A5300; --warn-ink:#FFFFFF; --crit:#B3261E;
  --scrim:rgba(24,14,9,.52);
  --intro-bg:#1D6B57; --intro-ink:#F3FBF7;
  --tile-a:#F5C24F; --tile-b:#A9D6C6; --tile-c:#F5B29C; --tile-d:#EFD9AE; --tile-dot:rgba(255,255,255,.42);
  --art-ink:#2B1A12; --art-shadow:rgba(43,26,18,.16);
  --f-bun:#E7A53F; --f-bun-hi:#F7D387; --f-leaf:#5FA343; --f-tomato:#D9452C; --f-cheese:#F9C93B; --f-crumb:#D9902E;
  --f-pork:#8C3A22; --f-pork-hi:#C2633F; --f-beef:#5C301C; --f-veg:#6E8B3D; --f-fish:#FBEFE0; --f-fishfry:#E5A748;
  --f-shrimp:#F28B6C; --f-sauce:#F4A88F; --f-lime:#9CCB3B; --f-mango:#F4B53C; --f-onion:#A0457A; --f-plantain:#EBB64B;
  --f-plantain-dk:#B87A22; --f-fry:#E8782A; --f-potato:#F2C75C; --f-kraft:#D2A86E; --f-glass:#EAF5F1; --f-juice:#F39A2B;
  --f-can:#2F8F78; --f-canband:#F5C24F; --f-beer:#F4C04A; --f-label:#F5EBD0; --f-berry:#EC7A98; --f-plate:#FFFDF8;
  --f-bowl:#2E8C73; --f-ceviche:#F4EFD9; --f-box:#F08A6B; --f-straw:#C9361E; --f-ticket:#FFFEF9;
  --shadow-pop:0 18px 50px -24px rgba(43,26,18,.55);
  --font-display:'Anton', Impact, 'Haettenschweiler', 'Arial Narrow Bold', 'Arial Narrow', 'Roboto Condensed', sans-serif-condensed, sans-serif;
  --font-text:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-ticket:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bar-h:96px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --masa:#1A120E; --masa-deep:#261B15; --paper:#22180F; --cafe:#F6E7D0; --cafe-soft:#C8AE94; --line:#3B2B21;
    --chile:#EE6447; --chile-ink:#1A120E; --chile-soft:#4A2219;
    --nopal:#5EBC9F; --nopal-ink:#0E1E19; --nopal-soft:#163A31;
    --sol:#F4C35A; --sol-soft:#463614;
    --chrome:#0E0907; --chrome-ink:#F6E7D0; --chrome-soft:#2C211B;
    --ok:#6CC28F; --ok-ink:#0E1E19; --warn:#E8AE55; --warn-ink:#1A120E; --crit:#F28B82;
    --scrim:rgba(0,0,0,.62);
    --intro-bg:#163A31; --intro-ink:#E3F4EC;
    --tile-a:#D7A43C; --tile-b:#6DA893; --tile-c:#D98C73; --tile-d:#BFA67A; --tile-dot:rgba(255,255,255,.22);
    --art-shadow:rgba(0,0,0,.35);
    --shadow-pop:0 18px 50px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --masa:#1A120E; --masa-deep:#261B15; --paper:#22180F; --cafe:#F6E7D0; --cafe-soft:#C8AE94; --line:#3B2B21;
  --chile:#EE6447; --chile-ink:#1A120E; --chile-soft:#4A2219;
  --nopal:#5EBC9F; --nopal-ink:#0E1E19; --nopal-soft:#163A31;
  --sol:#F4C35A; --sol-soft:#463614;
  --chrome:#0E0907; --chrome-ink:#F6E7D0; --chrome-soft:#2C211B;
  --ok:#6CC28F; --ok-ink:#0E1E19; --warn:#E8AE55; --warn-ink:#1A120E; --crit:#F28B82;
  --scrim:rgba(0,0,0,.62);
  --intro-bg:#163A31; --intro-ink:#E3F4EC;
  --tile-a:#D7A43C; --tile-b:#6DA893; --tile-c:#D98C73; --tile-d:#BFA67A; --tile-dot:rgba(255,255,255,.22);
  --art-shadow:rgba(0,0,0,.35);
  --shadow-pop:0 18px 50px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.locked{overflow:hidden}
body{background:var(--masa);color:var(--cafe);font-family:var(--font-text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--chrome)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1140px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}
.small{font-size:13.5px;color:var(--cafe-soft);margin:0}
.link{background:none;border:0;padding:0;color:var(--nopal);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:13.5px;text-align:left}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Demo bar */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--chrome);color:var(--chrome-ink)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:8px}
.bar-id{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;font-size:14px}
.bar-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:479.98px){.bar-name{display:none}.bar-btn{padding:5px 10px}}
.demo-pill{background:var(--sol);color:var(--on-sol);font-weight:800;font-size:12px;padding:3px 9px;border-radius:999px}
.bar-clock{font-variant-numeric:tabular-nums;opacity:.75;font-size:13px}
.bar-act{display:flex;gap:6px}
.bar-btn{background:transparent;border:1px solid var(--chrome-soft);color:var(--chrome-ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.tabs{order:3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%;background:var(--chrome-soft);padding:4px;border-radius:12px}
.tab{background:transparent;border:0;color:var(--chrome-ink);padding:7px 2px;border-radius:9px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.tab[aria-selected="true"]{background:var(--chrome-ink);color:var(--chrome)}
.tab .n{background:var(--chile);color:var(--chile-ink);border-radius:999px;font-size:11px;line-height:1.5;padding:0 6px;font-weight:800}
@media (max-width:400px){
  .tab{position:relative;font-size:13.5px}
  .tab .n{position:absolute;top:1px;right:3px;font-size:10px;padding:0 5px}
  .bar-btn{padding:4px 9px;font-size:12.5px}
}
.nw{white-space:nowrap}
@media (min-width:820px){.bar-in{flex-wrap:nowrap}.tabs{order:0;width:auto;grid-template-columns:repeat(4,auto);flex:none}.tab{padding:7px 16px}}

/* Hero */
.hero{background:var(--masa);overflow:hidden}
.papel{display:block;width:100%;height:56px}
.hero-grid{display:grid;gap:24px}
.hero-in{display:grid;gap:14px;padding-block:6px 22px;min-width:0}
.hero-in > *{min-width:0}
.hero-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px}
.wordmark{font-family:var(--font-display);font-weight:400;font-size:clamp(56px,18vw,136px);line-height:.86;margin:0;color:var(--chile);text-shadow:.05em .05em 0 var(--nopal);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;min-width:0}
.wordmark .ap{color:var(--sol)}
.tagline{font-size:clamp(17px,4.4vw,21px);font-weight:600;margin:0;max-width:36ch;line-height:1.3}
.lang-btn{border:1.5px solid var(--cafe);background:transparent;border-radius:999px;padding:4px 11px;font-weight:800;font-size:13px;margin-top:6px}
.signature{display:none}
@media (min-width:900px){
  .hero-grid{grid-template-columns:minmax(0,1fr) 340px;align-items:center}
  .signature{display:grid;gap:10px;justify-items:start;background-color:var(--tile-a);background-image:radial-gradient(circle at 3px 3px,var(--tile-dot) 1.4px,transparent 1.7px);background-size:14px 14px;border-radius:28px;padding:22px 24px 24px;margin-block:6px 22px;color:var(--art-ink)}
  .signature .art{width:210px;height:210px;justify-self:center}
  .signature h2{font-family:var(--font-display);font-weight:400;font-size:40px;line-height:1;margin:0}
  .signature p{margin:0;font-weight:600;font-size:15.5px;max-width:30ch}
  .signature button{margin-top:4px;border:0;border-radius:12px;background:var(--art-ink);color:var(--tile-a);font-weight:800;padding:10px 16px}
}
.status{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin:0}
.status .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 24%,transparent);flex:none}
.status.paused .dot{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 24%,transparent)}
.status small{font-weight:500;color:var(--cafe-soft);font-size:14px}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--masa-deep);border-radius:14px;padding:4px;gap:4px;max-width:440px}
.mode button{border:0;background:transparent;border-radius:11px;padding:10px 8px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.mode button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 0 var(--line),0 6px 16px -10px rgba(43,26,18,.5)}
.where{display:grid;gap:6px;max-width:440px}
.where-line{margin:0;font-size:14px;color:var(--cafe-soft)}
.select-wrap{position:relative}
.select-wrap svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.select{appearance:none;-webkit-appearance:none;width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 40px 11px 14px;font-weight:700}

/* Intro */
.intro{background:var(--intro-bg);color:var(--intro-ink);border-radius:20px;padding:16px 18px 18px;display:grid;gap:6px;margin-top:4px}
.intro h2{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.05;margin:0}
.intro p{margin:0;font-size:15px;max-width:62ch}
.intro button{justify-self:start;margin-top:6px;border:0;border-radius:999px;background:var(--intro-ink);color:var(--intro-bg);font-weight:800;padding:7px 14px;font-size:14px}

/* Category chips */
.cats{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar-h));z-index:20;background:var(--masa);border-bottom:1px solid var(--line);margin-top:18px}
.cats-in{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.cats-in::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--cafe);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.chip[aria-current="true"]{background:var(--cafe);color:var(--masa)}
.chip.sm{padding:4px 11px;font-size:13px;border-width:1px}

/* Menu */
.layout{display:grid;gap:28px;padding-block:22px 130px}
.menu{min-width:0}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.basket-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 70px);max-height:calc(100vh - var(--bar-h) - 90px);overflow:auto}}
@media (max-width:899.98px){.basket-col{display:none}}
.sec{scroll-margin-top:calc(var(--bar-h) + 66px)}
.sec + .sec{margin-top:36px}
.sec-head{display:grid;gap:4px;margin-bottom:4px}
.sec-head h2{font-family:var(--font-display);font-weight:400;font-size:clamp(32px,8.4vw,46px);line-height:1;margin:0;display:flex;align-items:center;gap:12px}
.sec-head p{margin:0;color:var(--cafe-soft);font-size:15px}
.mini-flag{width:18px;height:26px;flex:none}
.dishes{list-style:none;margin:0;padding:0}
@media (min-width:1180px){.dishes{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}}
.dish{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding-block:16px;border-bottom:1px solid var(--line)}
.dish-name{margin:0;font-size:18px;font-weight:800;line-height:1.2}
.dish-open{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left}
.dish-open::after{content:"";position:absolute;inset:0}
.dish-open:focus-visible{outline:none}
.dish-open:focus-visible::after{outline:3px solid var(--sol);outline-offset:2px;border-radius:10px}
.dish-desc{margin:4px 0 0;color:var(--cafe-soft);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px}
.price{font-family:var(--font-display);font-size:21px;line-height:1;letter-spacing:.01em}
.meal{font-size:13.5px;font-weight:700;color:var(--nopal)}
.tag{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sol-soft);color:var(--cafe);white-space:nowrap}
.tag.t-vege{background:var(--nopal-soft)}
.tag.t-spicy{background:var(--chile-soft)}
.sold-label{font-size:13px;font-weight:800;color:var(--crit)}
.art-tile{position:relative;pointer-events:none;width:96px;height:96px;border-radius:18px;display:grid;place-items:center;background-color:var(--tile-a);background-image:radial-gradient(circle at 3px 3px,var(--tile-dot) 1.3px,transparent 1.6px);background-size:11px 11px;flex:none}
.art-tile.b{background-color:var(--tile-b)}.art-tile.c{background-color:var(--tile-c)}.art-tile.d{background-color:var(--tile-d)}
.art{width:86%;height:86%;display:block}
.quick{position:absolute;pointer-events:auto;right:-7px;bottom:-7px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:var(--chile);color:var(--chile-ink);display:grid;place-items:center;box-shadow:0 0 0 3px var(--masa)}
.dish.sold .art-tile{filter:grayscale(1);opacity:.5}
.dish.sold .dish-name{color:var(--cafe-soft)}

/* Basket panel */
.bp{display:grid;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px}
.sheet .bp{background:transparent;border:0;padding:0}
.bp-title{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1;margin:0}
.bp-mode{margin:0;font-size:14px;color:var(--cafe-soft)}
.bp-empty{margin:0;color:var(--cafe-soft);font-size:15px}
.bl{list-style:none;margin:0;padding:0;display:grid}
.bl-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.bl-main{display:grid;gap:2px;min-width:0}
.bl-main b{font-weight:800}
.bl-opt{font-size:13.5px;color:var(--cafe-soft)}
.bl-note{font-size:13.5px;font-style:italic;color:var(--cafe-soft)}
.bl-side{display:grid;justify-items:end;gap:6px;align-content:start}
.bl-price{font-weight:800;font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--paper)}
.qty button{width:40px;height:40px;border:0;background:transparent;display:grid;place-items:center;border-radius:10px}
.qty span{min-width:22px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.qty.sm button{width:32px;height:32px}
.suggest{display:grid;gap:8px}
.suggest-row{display:flex;flex-wrap:wrap;gap:8px}
.sug{border:1.5px dashed var(--cafe-soft);background:transparent;border-radius:12px;padding:7px 11px;font-weight:700;font-size:13.5px}
.check{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--chile)}
.promo{display:flex;gap:8px}
.promo input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--masa);border-radius:12px;padding:9px 12px;text-transform:uppercase}
.promo-msg{margin:0;font-size:13.5px;font-weight:600}
.promo-msg.ok{color:var(--nopal)}.promo-msg.bad{color:var(--crit)}
.totals{display:grid;gap:4px;font-variant-numeric:tabular-nums;margin:0}
.totals div{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
.totals dt{color:var(--cafe-soft)}.totals dd{margin:0}
.totals .grand{font-weight:800;font-size:17px;padding-top:6px;border-top:1px solid var(--line)}
.totals .grand dt{color:var(--cafe)}
.block-msg{margin:0;font-size:14px;font-weight:700;color:var(--crit)}
.btn-primary{width:100%;border:0;border-radius:14px;background:var(--chile);color:var(--chile-ink);font-weight:800;padding:14px 16px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn-primary:disabled{opacity:.45}

/* Basket bar */
.basket-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--masa) 62%,transparent)}
.basket-btn{width:100%;max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:16px;background:var(--chile);color:var(--chile-ink);padding:14px 18px;font-weight:800;font-size:16px;box-shadow:var(--shadow-pop)}
.bb-l{display:flex;align-items:center;gap:10px}
.bb-n{background:var(--chile-ink);color:var(--chile);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;padding:0 6px}
@media (min-width:900px){.basket-bar{display:none}}

/* Footer */
.foot{border-top:1px solid var(--line);padding-block:24px 150px;font-size:14px;color:var(--cafe-soft);display:grid;gap:8px}
.foot p{margin:0}
.foot b{color:var(--cafe)}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 16px}
.foot-links button{background:none;border:0;padding:0;color:var(--cafe);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.foot-demo{border:1.5px dashed var(--cafe-soft);border-radius:12px;padding:10px 12px;margin-top:6px!important}
.sel{user-select:all;color:var(--cafe);font-weight:700;white-space:nowrap}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center}
#sheet[hidden]{display:none}
.sheet-back{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:620px;max-height:calc(100% - 36px - env(safe-area-inset-top,0px));background:var(--paper);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-pop);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}

const moneyFr = n => money(n, 'fr');

function toMin(s){ const [h, m] = s.split(':').map(Number); return h * 60 + m; }

    g.push({key:'formule', label:'option', def:'seul', choices:[{v:'seul', label:{fr:T.fr.only, en:T.en.only}, delta:0}, {v:'menu', label:{fr:T.fr.meal, en:T.en.meal}, delta:it.meal}]});
    if(opts && opts.formule === 'menu'){
      g.push({key:'drink', label:'drink', def:'s:Coca-Cola', choices:[
        ...SODAS.map(s => ({v:'s:' + s, label:s, delta:0, grp:'soda'})),
        ...JUICES.map(j => ({v:'j:' + j.fr, label:{fr:'Jus ' + j.fr.toLowerCase(), en:j.en + ' juice'}, delta:1, grp:'juice'}))

  } else if(it.id === 'tenders-p'){

  } else if(it.id === 'kids'){
    g.push({key:'main', label:'main', def:'tenders', choices:[{v:'tenders', label:{fr:'Tenders de poulet', en:'Chicken tenders'}, delta:0}, {v:'fish', label:{fr:'Fish pané', en:'Breaded fish'}, delta:0}]});
    g.push({key:'fries', label:'fries', def:'patate', choices:[{v:'pdt', label:{fr:'Pommes de terre', en:'Potato'}, delta:0}, {v:'patate', label:{fr:'Patates douces', en:'Sweet potato'}, delta:0}]});

function defaultOpts(it){ const o = {}; groupsFor(it, {}).forEach(g => { o[g.key] = g.def; }); return o; }

function optSummary(it, opts, lang){
  const lg = lang || S.lang; const parts = [];
  groupsFor(it, opts).forEach(g => {
    const c = g.choices.find(c => c.v === opts[g.key]); if(!c) return;

  const sub = Math.round(S.basket.reduce((s, l) => s + unitPrice(item(l.id), l.opts) * l.qty, 0) * 100) / 100;

}

}

  if(k && !document.contains(a)){ try{ const n = root.querySelector(k); if(n && n.getClientRects().length) n.focus({preventScroll:true}); }catch(e){} }
}

/* the wordmark shrinks to its column if a fallback font is wider than Anton */
function fitWordmark(){
  const w = document.querySelector('.wordmark'); if(!w) return;
  w.style.fontSize = '';
  const avail = w.clientWidth, need = w.scrollWidth;
  if(avail > 0 && need > avail + 1){ const cur = parseFloat(getComputedStyle(w).fontSize); w.style.fontSize = Math.floor(cur * avail / need) + 'px'; }
}

function ticketText(o){
  const z = zoneById(o.zone); const W = 34; const line = '-'.repeat(W);
  const pad = (a, b) => { const s = a + ' ' + b; return a + ' '.repeat(Math.max(1, W - s.length + 1)) + b; };
  const out = ['TAKIT’OS  CUISINE', pad('#' + o.id + '  ' + hm(nowMin()), o.mode === 'delivery' ? 'LIVRAISON' : 'A EMPORTER'), o.slot === 'asap' ? 'Dès que possible, vers ' + hm(o.eta) : 'Créneau ' + o.slot, line];
  o.lines.forEach(l => { const it = item(l.id); out.push(l.qty + 'x ' + it.name.fr.toUpperCase()); const sum = optSummary(it, l.opts, 'fr'); if(sum) out.push('   ' + sum); if(l.note) out.push('   > ' + l.note); });
  out.push(line);
  if(o.mode === 'delivery') out.push((z ? z.short : '') + ', ' + placeText(o));
  out.push(o.name + '  ' + o.phone);
  if(o.cutlery) out.push('Couverts : oui');
  out.push(pad(o.pay === 'cash' ? 'ESPECES' : 'CARTE', moneyFr(o.total).replace(/ | /g, ' ')));
  return out.join('\n');
}

function dishStats(){
  const live = {};
  S.orders.forEach(o => o.lines.forEach(l => { live[l.id] = (live[l.id] || 0) + l.qty; }));
  const fbAgg = {};
  Object.values(S.feedback).forEach(fb => { Object.keys(fb.r).forEach(id => { const a = fbAgg[id] || (fbAgg[id] = {sum:0, n:0, cold:0}); a.sum += fb.r[id]; a.n++; const tg = fb.tags[id] || {}; if(tg.cold || tg.soggy) a.cold++; }); });
  return Object.keys(BASE).map(id => {
    const [views, add, orders, rating, n, cold] = BASE[id]; const f = fbAgg[id] || {sum:0, n:0, cold:0};
    const nn = n + f.n; const r = (rating * n + f.sum) / nn; const cc = cold + f.cold;
    const ord = orders + (live[id] || 0);
    let sig = ''; let cls = '';
    if(cc / nn >= 0.2){ sig = 'Emballage à revoir'; cls = 'fix'; }
    else if(r < 4.0){ sig = 'À retravailler'; cls = 'fix'; }
    else if(r >= 4.7 && ord < 25){ sig = 'À mettre en avant'; cls = 'push'; }
    else if(r >= 4.6 && ord >= 50){ sig = 'Star'; cls = 'star'; }
    return {id, views, add, orders:ord, rating:r, n:nn, cold:cc, sig, cls};
  }).sort((a, b) => b.orders - a.orders);
}
function chartSVG(){
  const slots = []; for(let m = 18 * 60 + 30; m <= 21 * 60 + 15; m += 15) slots.push(m);
  const data = slots.map(m => ({m, n:slotLoad(m)}));
  const cap = S.settings.cap; const maxV = Math.max(cap + 1, ...data.map(d => d.n));
  const W = 680, H = 250, Lm = 34, R = 12, Tm = 22, B = 34; const iw = W - Lm - R, ih = H - Tm - B; const bw = iw / data.length;
  const y = v => Tm + ih - v / maxV * ih;
  let grid = ''; for(let v = 0; v <= maxV; v++){ grid += '<line x1="' + Lm + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-width="1"/>' + '<text x="' + (Lm - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="12" fill="var(--cafe-soft)">' + v + '</text>'; }
  const bars = data.map((d, i) => {
    const x = Lm + i * bw + 3, w = bw - 6, top = y(d.n), h = Tm + ih - top; const full = d.n >= cap;
    const r = Math.min(4, w / 2, h);
    const path = h > 0 ? 'M' + x + ' ' + (Tm + ih) + 'V' + (top + r) + 'q0 -' + r + ' ' + r + ' -' + r + 'H' + (x + w - r) + 'q' + r + ' 0 ' + r + ' ' + r + 'V' + (Tm + ih) + 'z' : '';
    return (path ? '<path d="' + path + '" fill="' + (full ? 'var(--chile)' : 'var(--nopal)') + '"><title>' + hm(d.m) + ' : ' + d.n + ' commande' + (d.n > 1 ? 's' : '') + ' pour une capacité de ' + cap + '</title></path>' : '') +
      (full ? '<text x="' + (x + w / 2) + '" y="' + (top - 6) + '" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--cafe)">complet</text>' : '') +
      (i % 2 === 0 ? '<text x="' + (x + w / 2) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="12" fill="var(--cafe-soft)">' + hm(d.m) + '</text>' : '');
  }).join('');
  const cy = y(cap);
  const capLine = '<line x1="' + Lm + '" x2="' + (W - R) + '" y1="' + cy + '" y2="' + cy + '" stroke="var(--cafe)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="' + (W - R) + '" y="' + (cy - 6) + '" text-anchor="end" font-size="12" font-weight="700" fill="var(--cafe)">capacité ' + cap + '</text>';
  return {svg:'<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Commandes par créneau de 15 minutes ce soir, capacité ' + cap + '">' + grid + bars + capLine + '</svg>', full:data.filter(d => d.n >= cap).map(d => hm(d.m))};
}
function viewInsights(){
  const live = S.orders.filter(o => o.id >= 1042);
  const nOrders = 142 + live.length; const basketAvg = (142 * 31.8 + live.reduce((s, o) => s + o.total, 0)) / nOrders;
  const fbs = Object.values(S.feedback); let rs = 0, rn = 0; fbs.forEach(fb => Object.values(fb.r).forEach(v => { rs += v; rn++; }));
  const rating = (4.5 * 96 + rs) / (96 + rn);
  const ch = chartSVG();
  const title = ch.full.length ? 'Ce soir, la cuisine est pleine à ' + ch.full.join(', ') : 'Aucun créneau complet ce soir';
  const fr = n => n.toFixed(1).replace('.', ',');
  const rows = dishStats().map(d => '<tr><td class="c-name"><b>' + esc(item(d.id).name.fr) + '</b><span class="c-meta">' + d.orders + ' commandes, note ' + fr(d.rating) + ', ' + d.add + ' % d’ajout au panier' + (d.cold ? ', ' + d.cold + ' avis froid ou ramolli' : '') + '</span></td>' +
    '<td class="num c-x">' + d.orders + '</td><td class="num c-x">' + d.add + ' %</td><td class="num c-x">' + fr(d.rating) + '</td><td class="num c-x">' + d.cold + '</td><td class="c-sig">' + (d.sig ? '<span class="signal ' + d.cls + '">' + d.sig + '</span>' : '') + '</td></tr>').join('');
  return '<div class="wrap staff"><div class="staff-head"><div><h1>Pilotage</h1><p>Exemple de tableau de bord avec des données fictives sur 7 jours ; vos commandes et vos notes de test s’y ajoutent en direct.</p></div></div>' +
    '<div class="kpis"><div class="kpi"><b>' + nOrders + '</b><span>commandes sur 7 jours</span></div><div class="kpi"><b>' + moneyFr(basketAvg) + '</b><span>panier moyen</span></div><div class="kpi"><b>34 %</b><span>des clients repassent commande sous 30 jours</span></div><div class="kpi"><b>' + fr(rating) + '/5</b><span>note moyenne, ' + (96 + rn) + ' avis privés</span></div></div>' +
    '<section class="card" aria-labelledby="c1"><h2 id="c1">' + title + '</h2><p class="sub">Commandes par créneau de 15 minutes, ligne pointillée : capacité réglée en cuisine. Exemple et commandes de test.</p><div class="chart-wrap">' + ch.svg + '</div><p class="sub">Les créneaux complets se ferment sur le site ; la précommande en fin d’après-midi lisse le pic.</p></section>' +
    '<section class="card" aria-labelledby="c2"><h2 id="c2">Les plats, du plus commandé au moins commandé</h2><p class="sub">« Froid ou ramolli » compte les avis privés qui le signalent. Données fictives et vos notes de test.</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th scope="col">Plat</th><th scope="col" class="num">Commandes</th><th scope="col" class="num">Ajout au panier</th><th scope="col" class="num">Note</th><th scope="col" class="num">Froid ou ramolli</th><th scope="col">Signal</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>' +
    '<section class="card" aria-labelledby="c3"><h2 id="c3">Résumé de la semaine, rédigé automatiquement</h2><p class="sub">Exemple de ce que les chefs recevraient chaque lundi.</p><ul class="digest">' +
    '<li>Le pulled pork est le burger le plus commandé et l’un des mieux notés : il mérite la première place et la première photo.</li>' +
    '<li>Les frites de patates douces cumulent les avis « froid ou ramolli » : tester une boîte ventilée avant l’été.</li>' +
    '<li>Le ceviche a la meilleure note mais peu de commandes : le proposer en plat du moment, avec une photo.</li>' +
    '<li>19:30 et 19:45 sont complets presque tous les soirs : ouvrir la précommande dès 17:00.</li></ul></section></div>';
}

/* ---------------- scroll spy ---------------- */
let spy = null;
function setupSpy(){
  if(spy){ spy.disconnect(); spy = null; }
  if(S.view !== 'client' || S.screen === 'track' || !('IntersectionObserver' in window)) return;
  const top = ($('#bar') ? $('#bar').offsetHeight : 90) + 60;
  spy = new IntersectionObserver(es => { es.forEach(e => { if(e.isIntersecting) markChip(e.target.dataset.c); }); }, {rootMargin:'-' + top + 'px 0px -55% 0px', threshold:0});
  document.querySelectorAll('.sec').forEach(s => spy.observe(s));
}
function markChip(id){
  document.querySelectorAll('.chip[data-c]').forEach(b => b.setAttribute('aria-current', b.dataset.c === id ? 'true' : 'false'));
  const b = document.querySelector('.chip[data-c="' + id + '"]'); const box = document.querySelector('.cats-in');
  if(b && box) box.scrollTo({left:b.offsetLeft - box.clientWidth / 2 + b.clientWidth / 2, behavior:reduceMotion() ? 'auto' : 'smooth'});
}

/* ---------------- actions ---------------- */
let toastTimer = null;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600); }
function setView(v){ S.view = v; try{ history.replaceState(null, '', '#' + ({client:'client', kitchen:'cuisine', driver:'livreur', insights:'pilotage'}[v])); }catch(e){} save(); render(); window.scrollTo(0, 0); }
function advance(id){
  const o = orderById(id); if(!o) return;
  const flow = o.mode === 'delivery' ? ['received', 'preparing', 'ready', 'out', 'done'] : ['received', 'preparing', 'ready', 'done'];
  const i = flow.indexOf(o.status); if(i < 0 || i >= flow.length - 1) return;
  o.status = flow[i + 1];
  const z = zoneById(o.zone);
  S.skew = (S.skew || 0) + ({preparing:2, ready:9, out:2, done:o.mode === 'delivery' ? (z ? z.travel : 10) : 3}[o.status] || 0);
  o.log.push({s:o.status, t:nowMin()});
  if(o.status === 'preparing'){ S.lastTicket = ticketText(o); toast('Ticket #' + o.id + ' imprimé'); }
  save();
}
function placeOrder(){
  const tt = totals(); const z = zoneById(S.zone); const f = S.form;
  const eta = f.slot === 'asap' ? nowMin() + etaFor(S.mode, z) : toMin(f.slot);
  const o = {id:S.seq++, created:nowMin(), source:'web', mode:S.mode, zone:S.mode === 'delivery' ? S.zone : '', name:f.name.trim(), phone:f.phone.trim(),
    place:S.mode === 'delivery' ? {type:f.type, camping:f.camping, pitch:f.pitch, street:f.street, notes:f.notes} : {}, slot:f.slot, eta, pay:f.pay, status:'received', cutlery:S.cutlery, optin:f.optin,
    lines:S.basket.map(l => ({id:l.id, qty:l.qty, opts:Object.assign({}, l.opts), note:l.note})), subtotal:tt.sub, discount:tt.disc, fee:tt.fee, total:tt.total, log:[{s:'received', t:nowMin()}]};
  S.orders.push(o); S.basket = []; S.promo = ''; S.promoMsg = ''; S.trackId = o.id; S.screen = 'track'; f.age = false;
  closeSheet(); save(); render(); window.scrollTo(0, 0);
}
const ACT = {
  view:el => setView(el.dataset.v),
  guide:() => openSheet('guide'),
  reset:() => { S = fresh(); closeSheet(); save(); render(); window.scrollTo(0, 0); toast('Démo réinitialisée'); },
  lang:el => { S.lang = el.dataset.l; save(); render(); if(SH) renderSheet(true); },
  mode:el => { S.mode = el.dataset.m; save(); render(); },
  'intro-close':() => { S.intro = false; save(); render(); },
  cat:el => { const sec = $('#sec-' + el.dataset.c); if(!sec) return; const yy = sec.getBoundingClientRect().top + window.scrollY - (($('#bar') || {}).offsetHeight || 90) - 56; window.scrollTo({top:yy, behavior:reduceMotion() ? 'auto' : 'smooth'}); markChip(el.dataset.c); },
  'open-dish':el => { const it = item(el.dataset.id); openSheet('dish', {id:it.id, opts:defaultOpts(it), qty:1, note:''}); },
  'quick-add':el => { const it = item(el.dataset.id); if(S.sold[it.id]) return; if(groupsFor(it, {}).length){ const ret = (SH && SH.kind === 'checkout') ? {kind:'checkout', step:SH.step} : null; openSheet('dish', {id:it.id, opts:defaultOpts(it), qty:1, note:'', ret}); return; } addLine(it.id, {}, 1, ''); save(); render(); if(SH && SH.kind === 'checkout') renderSheet(true); toast(t('added') + ' : ' + L(it.name)); },
  'sheet-inc':() => { SH.qty = Math.min(20, SH.qty + 1); renderSheet(true); },
  'sheet-dec':() => { SH.qty = Math.max(1, SH.qty - 1); renderSheet(true); },
  'sheet-add':() => { const it = item(SH.id); if(S.sold[it.id]) return; const ret = SH.ret; addLine(it.id, SH.opts, SH.qty, SH.note.trim()); closeSheet(); save(); render(); toast(t('added') + ' : ' + L(it.name)); if(ret) openSheet(ret.kind, {step:ret.step}); },
  'open-basket':() => openSheet('checkout', {step:1}),
  'checkout-start':() => openSheet('checkout', {step:2}),
  'line-inc':el => { S.basket[+el.dataset.i].qty++; save(); render(); if(SH) renderSheet(true); },
  'line-dec':el => { const l = S.basket[+el.dataset.i]; l.qty--; if(l.qty <= 0) S.basket.splice(+el.dataset.i, 1); save(); render(); if(SH){ if(!S.basket.length) closeSheet(); else renderSheet(true); } },
  'line-meal':el => { const l = S.basket[+el.dataset.i]; l.opts = {formule:'menu', drink:'s:Coca-Cola'}; save(); render(); if(SH) renderSheet(true); },
  'apply-promo':el => { const inp = document.getElementById(el.dataset.src); const v = (inp ? inp.value : '').trim().toUpperCase(); if(v === 'BIENVENUE'){ S.promo = 'BIENVENUE'; S.promoMsg = ''; } else { S.promoMsg = 'bad'; } save(); render(); if(SH) renderSheet(true); },
  'promo-remove':() => { S.promo = ''; save(); render(); if(SH) renderSheet(true); },
  'checkout-next':() => { if(blockReason()) return; SH.step = 2; SH.err = ''; renderSheet(); },
  'checkout-back':() => { SH.step = Math.max(1, SH.step - 1); SH.err = ''; renderSheet(); },
  'send-code':() => {
    const f = S.form; let err = '';
    if(!f.name.trim() || f.phone.replace(/\D/g, '').length < 10) err = t('errName');
    else if(S.mode === 'delivery' && !zoneById(S.zone)) err = t('pickCommune');
    else if(S.mode === 'delivery' && ((f.type === 'camping' && !f.camping.trim()) || (f.type !== 'camping' && !f.street.trim()))) err = t('errPlace');
    else if(hasAlcohol(S.basket) && !f.age) err = t('errAge');
    else if(blockReason()) err = blockReason();
    else if(S.settings.paused && f.slot === 'asap') err = t('errSlot');
    else if(f.slot !== 'asap' && slotList().some(s => hm(s.m) === f.slot && s.full)) err = t('errSlot');
    SH.err = err; if(!err){ SH.step = 3; } renderSheet(!!err); if(!err) setTimeout(() => { const c = $('#f-code'); if(c) c.focus(); }, 40);
  },
  'confirm-code':() => { const c = $('#f-code'); if(c && c.value.trim() === '1234') placeOrder(); else { SH.err = t('codeBad'); renderSheet(); setTimeout(() => { const n = $('#f-code'); if(n) n.focus(); }, 40); } },
  'close-sheet':() => closeSheet(),
  'track-advance':() => { advance(S.trackId); render(); },
  'back-menu':() => { S.screen = 'menu'; save(); render(); window.scrollTo(0, 0); },
  star:el => { const dr = S.fbDraft[el.dataset.o]; dr.r[el.dataset.d] = +el.dataset.v; save(); render(); },
  'fb-tag':el => { const dr = S.fbDraft[el.dataset.o]; const m = dr.tags[el.dataset.d] || (dr.tags[el.dataset.d] = {}); m[el.dataset.k] = !m[el.dataset.k]; save(); render(); },
  'fb-send':el => { const id = el.dataset.o; const dr = S.fbDraft[id]; if(!dr || !Object.keys(dr.r).length) return; S.feedback[id] = {r:dr.r, tags:dr.tags, comment:dr.comment}; delete S.fbDraft[id]; save(); render(); toast(S.lang === 'en' ? 'Thank you!' : 'Merci !'); },
  google:() => toast(t('googleDemo')),
  legal:() => toast(t('legalSoon')),
  'allergen-table':() => openSheet('allergens'),
  'k-pause':() => { S.settings.paused = !S.settings.paused; save(); render(); toast(S.settings.paused ? 'Commandes en ligne en pause' : 'Commandes en ligne ouvertes'); },
  'k-extra':el => { S.settings.extra = +el.dataset.v; save(); render(); },
  'k-cap':el => { S.settings.cap = Math.min(10, Math.max(1, S.settings.cap + (+el.dataset.v))); save(); render(); },
  'k-advance':el => { advance(+el.dataset.id); render(); },
  'k-sold':el => { const id = el.dataset.id; S.sold[id] = !S.sold[id]; save(); render(); toast(item(id).name.fr + (S.sold[id] ? ' : épuisé sur le site' : ' : de nouveau disponible')); },
  'k-fish':el => { S.momentDraft.fish = el.dataset.f; save(); render(); },
  'k-moment-save':() => { S.moment = {fish:S.momentDraft.fish.trim(), veggie:S.momentDraft.veggie.trim()}; save(); render(); toast('Publié : la carte en ligne est à jour'); },
  'phone-order':() => openSheet('phone', {draft:{name:'', pmode:'pickup', zone:'dolus', q:{}}}),
  'p-inc':el => { const q = SH.draft.q; q[el.dataset.id] = (q[el.dataset.id] || 0) + 1; renderSheet(true); },
  'p-dec':el => { const q = SH.draft.q; q[el.dataset.id] = Math.max(0, (q[el.dataset.id] || 0) - 1); if(!q[el.dataset.id]) delete q[el.dataset.id]; renderSheet(true); },
  'p-create':() => {
    const d = SH.draft; const ids = Object.keys(d.q); if(!ids.length) return;
    const lines = ids.map(id => ({id, qty:d.q[id], opts:defaultOpts(item(id)), note:''}));
    const z = d.pmode === 'delivery' ? zoneById(d.zone) : null;
    const sub = lines.reduce((s, l) => s + unitPrice(item(l.id), l.opts) * l.qty, 0);
    const prep = prepMin();
    const o = {id:S.seq++, created:nowMin(), source:'phone', mode:d.pmode, zone:z ? z.id : '', name:d.name.trim() || 'Client', phone:'au téléphone', place:z ? {type:'house', street:'Adresse notée au téléphone', notes:''} : {}, slot:'asap', eta:nowMin() + prep + (z ? z.travel : 0), pay:'card', status:'received', cutlery:false, optin:false, lines, subtotal:sub, discount:0, fee:z ? z.fee : 0, total:Math.round((sub + (z ? z.fee : 0)) * 100) / 100, log:[{s:'received', t:nowMin()}]};
    S.orders.push(o); closeSheet(); save(); render(); toast('Commande #' + o.id + ' ajoutée à la file');
  },
  'd-advance':el => { advance(+el.dataset.id); render(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  if(el.tagName === 'A' && el.getAttribute('href') !== '#') return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target; const ch = el.dataset && el.dataset.ch; if(!ch) return;
  if(ch === 'zone'){ S.zone = el.value; save(); render(); if(SH) renderSheet(true); return; }
  if(ch === 'cutlery'){ S.cutlery = el.checked; save(); render(); if(SH) renderSheet(true); return; }
  if(ch === 'opt'){ SH.opts[el.dataset.k] = el.value; if(el.dataset.k === 'formule'){ if(el.value === 'menu' && !SH.opts.drink) SH.opts.drink = 's:Coca-Cola'; if(el.value === 'seul') delete SH.opts.drink; } renderSheet(true); return; }
  if(ch === 'ptype'){ S.form.type = el.value; save(); renderSheet(true); return; }
  if(ch === 'slot'){ S.form.slot = el.value; save(); return; }
  if(ch === 'pay'){ S.form.pay = el.value; save(); return; }
  if(ch === 'age'){ S.form.age = el.checked; save(); return; }
  if(ch === 'optin'){ S.form.optin = el.checked; save(); return; }
  if(ch === 'pmode'){ SH.draft.pmode = el.value; renderSheet(true); return; }
  if(ch === 'pzone'){ SH.draft.zone = el.value; return; }
});
document.addEventListener('input', e => {
  const el = e.target; const k = el.dataset && el.dataset.in; if(!k) return;
  const map = {name:'name', phone:'phone', camping:'camping', pitch:'pitch', street:'street', notes:'notes'};
  if(map[k]){ S.form[map[k]] = el.value; save(); return; }
  if(k === 'dish-note' && SH){ SH.note = el.value; return; }
  if(k === 'fb-comment'){ const dr = S.fbDraft[el.dataset.o]; if(dr){ dr.comment = el.value; save(); } return; }
  if(k === 'm-fish'){ S.momentDraft.fish = el.value; save(); return; }
  if(k === 'm-veg'){ S.momentDraft.veggie = el.value; save(); return; }
  if(k === 'p-name' && SH){ SH.draft.name = el.value; return; }
  if(k === 'code' && el.value.trim().length === 4 && el.value.trim() === '1234'){ /* wait for the button press */ }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && SH){ closeSheet(); return; }
  if(e.key === 'Tab' && SH){
    const w = document.querySelector('#sheet .sheet'); if(!w) return;
    const f = [...w.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),summary,a[href]')].filter(n => n.getClientRects().length && !(n.type === 'radio' && !n.checked));
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(!w.contains(document.activeElement)){ e.preventDefault(); first.focus(); return; }
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); return; }
    if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); return; }
  }
  if(e.key === 'Enter' && e.target && e.target.id === 'f-code'){ e.preventDefault(); ACT['confirm-code'](); }
  if(e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.in === 'promo'){ e.preventDefault(); const b = e.target.parentNode.querySelector('[data-act="apply-promo"]'); if(b) ACT['apply-promo'](b); }
});
let resizeTimer = null;
window.addEventListener('resize', () => { measureBar(); clearTimeout(resizeTimer); resizeTimer = setTimeout(fitWordmark, 80); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measureBar(); fitWordmark(); }).catch(() => {});

/* ---------------- boot ---------------- */
S = load() || fresh();
const hv = {client:'client', cuisine:'kitchen', livreur:'driver', pilotage:'insights'}[(location.hash || '').replace('#', '')];
if(hv) S.view = hv;
render();
setInterval(() => { const c = document.querySelector('.bar-clock'); if(c) c.textContent = hm(nowMin()); }, 15000);
window.addEventListener('hashchange', () => { const v = {client:'client', cuisine:'kitchen', livreur:'driver', pilotage:'insights'}[(location.hash || '').replace('#', '')]; if(v && v !== S.view){ S.view = v; save(); render(); } });
})();
